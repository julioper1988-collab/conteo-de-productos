<title>Conteo Guaripola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: barra fija arriba (resumen), lista de filas tipo planilla de depósito, entrada rápida abajo */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1b2420; --muted:#5e6b64; --line:#d9dfdb;
  --accent:#0f7a52; --accent-fg:#ffffff; --ok:#0f7a52; --warn:#b26b00; --bad:#c0362c; --chip:#e7ece9;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --fg:#e6ece8; --muted:#97a59d; --line:#2c3832;
  --accent:#3fbf86; --accent-fg:#0b1410; --ok:#3fbf86; --warn:#e3a43b; --bad:#ef6b5f; --chip:#24302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --fg:#e6ece8; --muted:#97a59d; --line:#2c3832;
  --accent:#3fbf86; --accent-fg:#0b1410; --ok:#3fbf86; --warn:#e3a43b; --bad:#ef6b5f; --chip:#24302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;display:grid;gap:12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;gap:10px}
h1{font-family:var(--f-display);font-size:28px;margin:0;letter-spacing:.02em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.meta input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button,.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);border-radius:6px;font-weight:600}
.btn.ghost{border-radius:6px;background:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:1fr 96px 32px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.row.head{background:transparent;border:0;padding-block:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.name{min-width:0}
.name div{font-weight:500;overflow-wrap:anywhere}
.name small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.row input.cnt{width:100%;font:500 16px var(--f-mono);text-align:right;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.row.done input.cnt{border-color:var(--accent)}
.dif.pos{color:var(--warn)} .dif.neg{color:var(--bad)} .dif.zero{color:var(--ok)}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:4px}
.cat{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:4px 2px;border-bottom:2px solid var(--fg);font-family:var(--f-display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.cat small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar form{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 80px auto;gap:8px}
.bar input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
textarea#out{width:100%;min-height:140px;font:12px var(--f-mono);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr 90px 28px}
  .row .sis{display:none}
  .row.head .sis{display:none}
}
</style></head><body>

<div class="wrap">
<header>
  <h1>Conteo de stock</h1>
  <div class="meta">
    <input id="fecha" type="date" aria-label="Fecha">
    <input id="resp" placeholder="Responsable" aria-label="Responsable" style="flex:1">
  </div>
  <div class="stats">
    <div class="stat"><b id="sTot">0</b><span>Productos</span></div>
    <div class="stat ok"><b id="sCont">0</b><span>Contados</span></div>
    <div class="stat bad"><b id="sDif">0</b><span>Pendientes</span></div>
  </div>
  <div class="filters" id="filt">
    <button data-f="todos" aria-pressed="true">Todos</button>
    <button data-f="pend" aria-pressed="false">Pendientes</button>
    <select id="selCat" aria-label="Categoría" style="font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)"><option value="">Todas las categorías</option></select>
        <input id="q" placeholder="Buscar / código" aria-label="Buscar" style="flex:1;min-width:120px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)">
  </div>
</header>

<div class="list" id="list"></div>

<div class="tools"><button class="btn primary" id="bSend">Enviar conteo</button><span class="note" id="sendMsg" aria-live="polite"></span></div>

<div class="tools">
  <a class="btn ghost" id="bWa" href="https://wa.me/" target="_blank" rel="noopener" style="text-decoration:none">Enviar por WhatsApp</a>
  <button class="btn ghost" id="bCsv">Exportar CSV</button>
  <button class="btn ghost" id="bResumen">Resumen WhatsApp</button>
  <button class="btn ghost" id="bPaste">Cargar lista</button>
  <button class="btn ghost" id="bReset">Nuevo conteo</button>
</div>
<div class="tools"><button class="btn ghost" id="bHist">Historial</button></div>
<section id="hist" hidden style="display:grid;gap:8px">
  <h2 style="font-family:var(--f-display);font-size:20px;margin:8px 0 0;text-transform:uppercase;letter-spacing:.02em">Historial de conteos</h2>
  <form id="pinF" class="meta">
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN" style="width:120px">
    <input id="hDesde" type="date" aria-label="Desde">
    <button class="btn primary" type="submit">Ver</button>
    <span class="note" id="hMsg" aria-live="polite"></span>
  </form>
  <div class="list" id="hList"></div>
</section>
<div id="resetBox" class="confirm" hidden>¿Borrar todo el conteo? <button class="btn primary" id="rYes">Sí, borrar</button><button class="btn ghost" id="rNo">Cancelar</button></div>
<div id="outBox" hidden>
  <p class="note" id="outNote"></p>
  <textarea id="out"></textarea>
  <div class="tools"><button class="btn primary" id="bCopy">Copiar</button><button class="btn ghost" id="bApply" hidden>Cargar</button><button class="btn ghost" id="bClose">Cerrar</button></div>
</div>
<p class="note">Productos del sistema, los más vendidos (90 días) primero. Se guarda en este navegador. "Cargar lista": pegar <code>codigo;producto</code> por línea (desde Excel o Supabase).</p>
</div>

<div class="bar">
  <form id="add">
    <input id="aName" placeholder="Código o producto nuevo" aria-label="Producto" autocomplete="off">
    <input id="aQty" type="number" inputmode="decimal" placeholder="Cant." aria-label="Cantidad">
    <button class="btn primary" type="submit">Sumar</button>
  </form>
</div>

// Orden: líneas más vendidas primero; dentro de la línea de producto juntos, de menor a mayor tamaño; a igual tamaño, retornable primero
const SZ=/(\d+(?:\.\d+)?)\s*(ML|LTS?|L|KG|G)\b|(\d+)\s*S\b/;
function tam(n){n=n.toUpperCase().replace(',','.');let m=n.match(SZ);
  if(m){if(m[3])return +m[3];let v=+m[1];return /^(L|LT|LTS|KG)$/.test(m[2])?v*1000:v}
  if(/LITRO/.test(n))return 1000;
  m=n.match(/(\d+(?:\.\d+)?)(?!.*\d)/);if(m){const v=+m[1];return v<10?v*1000:v}return 0}
function linea(n){return n.toUpperCase().replace(/^(CERVEZA|GASEOSA|ENERGIZANTE|LICOR|JUGOS?)\s+/,'')
  .replace(new RegExp(SZ.source,'g'),' ').replace(/\b(LATA|BOT|BOTELLA|BOTELLITA|RET|RETORNABLE|VIDRIO|PLASTICO|DESCARTABLES?|DESC|PET|TETRA|ORIGINAL|BOX|X1|II|I|LITRO)\b/g,' ')

function marca(l){const w=l.replace(/^\d+\s+/,'').split(' ')[0]||l;return ALIAS[w]||w}
function ordenar(a){const o=a.map(i=>{const l=linea(i.n).replace(/\bCERO\b/g,'ZERO');return {i,l,g:cat(i.n),m:marca(l),t:tam(i.n),r:/\bRET/i.test(i.n)?0:1,v:VENTAS[i.c||i.n]||0}});
  const tl={},tm={},tg={};o.forEach(x=>{tl[x.l]=(tl[x.l]||0)+x.v;tm[x.m]=(tm[x.m]||0)+x.v;tg[x.g]=(tg[x.g]||0)+x.v});
  return o.sort((x,y)=>(x.g==='Otros')-(y.g==='Otros')||tg[y.g]-tg[x.g]||x.g.localeCompare(y.g,'es')||tm[y.m]-tm[x.m]||x.m.localeCompare(y.m,'es')||tl[y.l]-tl[x.l]||x.l.localeCompare(y.l,'es')||x.t-y.t||x.r-y.r||x.i.n.localeCompare(y.i.n,'es')).map(o=>o.i)}
let st={fecha:new Date().toISOString().slice(0,10),resp:'',items:ordenar(sample.map(([c,n,s])=>({c,n,s,k:null}))),f:'todos'};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.items)st=Object.assign(st,d)}catch(e){}
const enCat=i=>sample.some(([c,n])=>(c&&String(c)===String(i.c))||n===i.n);
{const f=sample.filter(([c,n])=>!st.items.some(i=>(c&&String(i.c)===String(c))||i.n===n));if(f.length)st.items=ordenar(st.items.concat(f.map(([c,n,s])=>({c,n,s,k:null}))))}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const fmt=n=>(n>0?'+':'')+n;
function render(){
  $('fecha').value=st.fecha;$('resp').value=st.resp;
  const q=$('q').value.trim().toLowerCase();
  let tot=st.items.length,cont=st.items.filter(i=>i.k!=null).length;
  $('sTot').textContent=tot;$('sCont').textContent=cont;$('sDif').textContent=tot-cont;
  document.querySelectorAll('#filt button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===st.f));
  const rows=st.items.map((i,ix)=>({i,ix})).filter(({i})=>{
    if(st.f==='pend'&&i.k!=null)return false;
    if(st.g&&cat(i.n)!==st.g)return false;
    return !q||i.n.toLowerCase().includes(q)||String(i.c).includes(q);
  });
  const L=$('list');
  L.innerHTML='<div class="row head"><span>Producto</span><span class="num">Cantidad</span><span></span></div>';
  if(!rows.length){L.insertAdjacentHTML('beforeend','<div class="empty">Sin productos en este filtro.</div>');return}
  const cc={};st.items.forEach(i=>{const g=cat(i.n);cc[g]=cc[g]||[0,0];cc[g][1]++;if(i.k!=null)cc[g][0]++});
  let prev=null;
  rows.forEach(({i,ix})=>{
    const g=cat(i.n);if(g!==prev){prev=g;const h=document.createElement('div');h.className='cat';
      h.innerHTML='<span></span><small></small>';h.firstChild.textContent=g;h.lastChild.textContent=cc[g][0]+'/'+cc[g][1];L.appendChild(h)}
    const r=document.createElement('div');r.className='row'+(i.k!=null?' done':'');
    r.innerHTML=`<div class="name"><div></div><small></small></div>      <input class="cnt" id="c${ix}" type="number" inputmode="decimal" value="${i.k??''}" aria-label="Conteo">
      <button class="del" aria-label="Quitar" title="Quitar">×</button>`;
    r.querySelector('.name div').textContent=i.n;r.querySelector('small').textContent=i.c||'';
    const inp=r.querySelector('input');
    inp.addEventListener('change',()=>{i.k=inp.value===''?null:Number(inp.value);save();render();
      const nx=document.querySelectorAll('.row input.cnt')[[...document.querySelectorAll('.row input.cnt')].findIndex(x=>x.id==='c'+ix)+1];if(nx)nx.focus()});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}});
    r.querySelector('.del').onclick=()=>{if(enCat(i))i.k=null;else st.items.splice(ix,1);save();render()};
    L.appendChild(r);
  });
}
$('fecha').onchange=e=>{st.fecha=e.target.value;save()};
$('resp').oninput=e=>{st.resp=e.target.value;save()};
$('q').oninput=render;
CATS.map(c=>c[0]).concat('Otros').filter(g=>st.items.some(i=>cat(i.n)===g)).sort((a,b)=>st.items.findIndex(i=>cat(i.n)===a)-st.items.findIndex(i=>cat(i.n)===b))
  .forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;$('selCat').appendChild(o)});
$('selCat').value=st.g||'';$('selCat').onchange=e=>{st.g=e.target.value;save();render()};
$('filt').onclick=e=>{const b=e.target.closest('button');if(b){st.f=b.dataset.f;save();render()}};
$('add').onsubmit=e=>{
  e.preventDefault();const v=$('aName').value.trim();const n=Number($('aQty').value||1);if(!v)return;
  let it=st.items.find(i=>String(i.c)===v||i.n.toLowerCase()===v.toLowerCase());
  if(!it){it={c:/^\d+$/.test(v)?v:'',n:/^\d+$/.test(v)?'Código '+v:v,s:0,k:0};st.items.push(it)}
  it.k=(it.k||0)+n;$('aName').value='';$('aQty').value='';$('aName').focus();save();render();
};
function show(note,txt,apply){$('outBox').hidden=false;$('outNote').textContent=note;$('out').value=txt;$('bApply').hidden=!apply;$('out').focus();$('out').select()}
$('bCsv').onclick=()=>show('CSV listo para Excel.',['codigo;producto;cantidad',...st.items.map(i=>[i.c,i.n,i.k??''].join(';'))].join('\n'));
const resumen=()=>{const c=st.items.filter(i=>i.k!=null);
  return `Conteo ${st.fecha}${st.resp?' · '+st.resp:''}\nContados: ${c.length}/${st.items.length}\n`+c.map(i=>`• ${i.n}: ${i.k}`).join('\n')};
$('bWa').addEventListener('click',()=>{$('bWa').href='https://wa.me/?text='+encodeURIComponent(resumen())});
$('bResumen').onclick=()=>{
  show('Resumen para enviar.',resumen());
};
$('bPaste').onclick=()=>show('Pegá una línea por producto: codigo;producto. Reemplaza la lista actual.','',true);
$('bApply').onclick=()=>{
  const it=$('out').value.split('\n').map(l=>l.split(/[;\t]/).map(x=>x.trim())).filter(a=>a.length>=2&&a[1])
    .map(a=>({c:a[0],n:a[1],s:Number((a[2]||'0').replace(',','.'))||0,k:null}));
  if(it.length){st.items=ordenar(it);save();render();$('outBox').hidden=true}
};
$('bCopy').onclick=()=>{navigator.clipboard.writeText($('out').value).then(()=>$('bCopy').textContent='Copiado').catch(()=>$('out').select());setTimeout(()=>$('bCopy').textContent='Copiar',1500)};
$('bClose').onclick=()=>$('outBox').hidden=true;
$('bReset').onclick=()=>$('resetBox').hidden=false;
$('rNo').onclick=()=>$('resetBox').hidden=true;
$('rYes').onclick=()=>{st.items.forEach(i=>i.k=null);st.fecha=new Date().toISOString().slice(0,10);$('resetBox').hidden=true;save();render()};
render();
// Historial y aplicar al inventario
const rpc=async(fn,body)=>{const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY_SB,Authorization:'Bearer '+KEY_SB,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);if(!r.ok){const m=(j&&j.message)||'';throw new Error(/pin_incorrecto/.test(m)?'PIN incorrecto.':/bloqueado/.test(m)?'Demasiados intentos. Esperá 15 minutos.':'No se pudo conectar. Probá de nuevo.')}return j};
const gs=n=>Math.round(n).toLocaleString('es-PY');
let PIN='';
$('bHist').onclick=()=>{$('hist').hidden=!$('hist').hidden;if(!$('hist').hidden)$('pin').focus()};
async function cargarHist(){
  const m=$('hMsg');m.textContent='Cargando…';
  try{const d=await rpc('conteos_listar2',{p_pin:PIN,p_desde:$('hDesde').value||null});
    m.textContent=d.length?'':'No hay conteos en ese rango.';
    const L=$('hList');L.innerHTML='';
    d.forEach(e=>{
      const conDif=e.items.filter(i=>i.pid&&Math.round(i.k)!==i.s).length, sinProd=e.items.filter(i=>!i.pid).length;
      const r=document.createElement('div');r.className='row';r.style.gridTemplateColumns='1fr';r.style.gap='6px';
      r.innerHTML='<div class="name"><div></div><small></small></div><div class="tools"></div><div class="confirm" hidden></div>';
      r.querySelector('.name div').textContent=e.fecha.split('-').reverse().join('/')+' · '+e.responsable;
      r.querySelector('small').textContent=new Date(e.created_at).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})+' · '+e.contados+' contados · '+conDif+' con diferencia'+(sinProd?' · '+sinProd+' sin vincular':'')+' · '+(e.aplicado_at?'APLICADO':'pendiente');
      const T=r.querySelector('.tools'),C=r.querySelector('.confirm');
      const bv=document.createElement('button');bv.className='btn ghost';bv.textContent='Ver diferencias';T.appendChild(bv);
      bv.onclick=()=>show('Conteo de '+e.responsable+' · diferencias contra el stock del sistema al momento de contar.',
        e.items.filter(i=>!i.pid||Math.round(i.k)!==i.s).map(i=>i.pid?`• ${i.n}: sistema ${i.s} / contado ${i.k} (${fmt(Math.round(i.k)-i.s)})`:`• ${i.n}: ${i.k} (no está en el sistema, se saltea)`).join('\n')||'Sin diferencias.');
      const bc=document.createElement('button');bc.className='btn ghost';bc.textContent='CSV';T.appendChild(bc);
      bc.onclick=()=>show('CSV.',['codigo;producto;sistema;contado;diferencia',...e.items.map(i=>[i.c,i.n,i.s??'',i.k,i.pid?Math.round(i.k)-i.s:''].join(';'))].join('\n'));
      if(!e.aplicado_at){
        const ba=document.createElement('button');ba.className='btn primary';ba.textContent='Aplicar al inventario';T.appendChild(ba);
        ba.onclick=()=>{C.hidden=false;C.innerHTML='';C.append(`Se van a ajustar ${conDif} productos en la bodega. `);
          const y=document.createElement('button');y.className='btn primary';y.textContent='Sí, aplicar';
          const n=document.createElement('button');n.className='btn ghost';n.textContent='Cancelar';C.append(y,n);
          n.onclick=()=>C.hidden=true;
          y.onclick=async()=>{y.disabled=true;y.textContent='Aplicando…';
            try{const x=await rpc('conteos_aplicar',{p_pin:PIN,p_id:e.id});
              if(!x.ok)throw new Error(x.error==='ya_aplicado'?'Este conteo ya fue aplicado.':'No se pudo aplicar.');
              m.textContent=`Aplicado ✓ ${x.aplicados} productos · dif. ${fmt(x.diferencia)} u · Gs. ${gs(x.diferencia_monto)}`+(x.omitidos?` · ${x.omitidos} salteados`:'');
              cargarHist();
            }catch(err){C.textContent=err.message}};
        };
      }
      L.appendChild(r);
    });
  }catch(err){m.textContent=err.message}
}
$('pinF').onsubmit=e=>{e.preventDefault();PIN=$('pin').value.trim();if(PIN)cargarHist()};
// Envío a Supabase (tabla bodega_conteos)
const SB='https://sdpysvowvwucjfnyosuf.supabase.co',KEY_SB='sb_publishable_Px9Uz083rGIy3drTUvlDdw_otNlwCvs';
$('bSend').onclick=async()=>{
  const m=$('sendMsg'),c=st.items.filter(i=>i.k!=null);
  if(!c.length){m.textContent='Cargá al menos un producto.';return}
  if(!st.resp.trim()){m.textContent='Poné tu nombre en Responsable.';$('resp').focus();return}
  $('bSend').disabled=true;m.textContent='Enviando…';
  try{const r=await fetch(SB+'/rest/v1/bodega_conteos',{method:'POST',headers:{apikey:KEY_SB,Authorization:'Bearer '+KEY_SB,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify({fecha:st.fecha,responsable:st.resp.trim().slice(0,80),contados:c.length,total:st.items.length,items:c.map(i=>({c:i.c||'',n:i.n,k:i.k}))})});
    if(!r.ok)throw new Error(r.status);
    m.textContent='Enviado ✓ '+new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
  }catch(e){m.textContent='No se pudo enviar. Revisá internet y probá de nuevo (o usá WhatsApp).'}
  $('bSend').disabled=false;
};
